<title>Хомяк-Инвест — симулятор биржи</title>

<style>
:root{--bg0:#0a0f1e;--panel:#121c36;--panel2:#0d1526;--line:rgba(148,163,184,.14);--txt:#e8edf7;--mut:#8fa0bd;--faint:#5b6b8c;--up:#2fd575;--up-dim:rgba(47,213,117,.13);--down:#ff5d6c;--down-dim:rgba(255,93,108,.13);--gold:#ffb648;--cyan:#4cc9f0;--tap:44px}
*{margin:0;padding:0;box-sizing:border-box}
html{scrollbar-color:#2a3a5e var(--bg0);-webkit-text-size-adjust:100%}
body{font-family:"Golos Text",system-ui,sans-serif;color:var(--txt);min-height:100vh;background:linear-gradient(160deg,#0b1226 0%,#0a0f1e 55%,#0c1428 100%);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button,input,[role="button"]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-2;opacity:.55;background:repeating-linear-gradient(0deg,rgba(148,163,184,.045) 0 1px,transparent 1px 44px),repeating-linear-gradient(90deg,rgba(148,163,184,.045) 0 1px,transparent 1px 44px)}
.glow{position:fixed;border-radius:50%;filter:blur(100px);opacity:.14;pointer-events:none;z-index:-1}
.g1{width:520px;height:520px;background:var(--gold);top:-180px;left:-120px;animation:drift 26s ease-in-out infinite alternate}
.g2{width:620px;height:620px;background:var(--cyan);bottom:-260px;right:-160px;animation:drift 32s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(90px,60px) scale(1.12)}}
.mono{font-family:"JetBrains Mono",monospace}
.up{color:var(--up)}.down{color:var(--down)}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 22px 10px;max-width:1680px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.coin{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:24px;flex:none;background:radial-gradient(circle at 32% 30%,#ffd98a,#f5a623 60%,#b9720f);box-shadow:0 0 0 3px #0a0f1e,0 0 0 5px rgba(255,182,72,.55),0 6px 18px rgba(245,166,35,.35);animation:coinPulse 3s ease-in-out infinite}
@keyframes coinPulse{50%{box-shadow:0 0 0 3px #0a0f1e,0 0 0 7px rgba(255,182,72,.25),0 6px 24px rgba(245,166,35,.5)}}
.brand h1{font-family:"Unbounded";font-weight:900;font-size:clamp(16px,2.4vw,21px);letter-spacing:.5px;line-height:1}
.brand h1 em{font-style:normal;color:var(--gold)}
.brand small{display:block;color:var(--mut);font-size:clamp(10px,1.5vw,11.5px);letter-spacing:.14em;text-transform:uppercase;margin-top:4px}
.hspace{flex:1;min-width:0}
.status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:rgba(13,21,38,.7);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--up);animation:blink 1.6s infinite}
.dot.off{background:var(--gold);animation:none}
@keyframes blink{50%{opacity:.25}}
.ghost-btn{border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:10px;padding:10px 16px;min-height:var(--tap);font:600 12.5px "Golos Text";cursor:pointer;transition:.2s;white-space:nowrap}
.ghost-btn:hover{color:var(--down);border-color:var(--down);background:var(--down-dim)}
.tape-wrap{border-block:1px solid var(--line);background:rgba(10,15,30,.8);overflow:hidden;position:relative}
.tape-wrap::before,.tape-wrap::after{content:"";position:absolute;top:0;bottom:0;width:70px;z-index:2;pointer-events:none}
.tape-wrap::before{left:0;background:linear-gradient(90deg,#0a0f1e,transparent)}
.tape-wrap::after{right:0;background:linear-gradient(-90deg,#0a0f1e,transparent)}
.tape{display:flex;width:max-content;animation:slide 48s linear infinite;padding:9px 0}
.tape-wrap:hover .tape{animation-play-state:paused}
@keyframes slide{to{transform:translateX(-50%)}}
.titem{display:flex;align-items:center;gap:9px;padding:0 22px;border-right:1px solid rgba(148,163,184,.1);font-size:13px;white-space:nowrap}
.titem b{font-family:"JetBrains Mono";font-weight:700;letter-spacing:.04em;color:var(--gold)}
.titem .tp{font-family:"JetBrains Mono";color:var(--txt)}
.titem .tc{font-family:"JetBrains Mono";font-size:12px}
.ad-slot{border:1px dashed rgba(148,163,184,.18);border-radius:12px;margin:14px 22px 0;max-width:1640px;min-height:90px;background:rgba(13,21,38,.35)}
.ad-rect{min-height:230px;margin:0}
.ad-bottom{margin:14px 22px 10px}
.views{display:flex;gap:8px;padding:14px 22px 0;max-width:1680px;margin:0 auto;overflow-x:auto;-webkit-overflow-scrolling:touch}
.vbtn{flex:none;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--panel2));color:var(--mut);font:800 13px "Golos Text";padding:11px 22px;min-height:var(--tap);border-radius:12px;cursor:pointer;transition:.2s;white-space:nowrap}
.vbtn:hover{color:var(--txt)}
.vbtn.on{color:var(--gold);border-color:rgba(255,182,72,.5);background:rgba(255,182,72,.1)}
.layout{display:grid;grid-template-columns:335px minmax(0,1fr) 355px;gap:16px;padding:16px 22px;max-width:1680px;margin:0 auto;align-items:start}
.panel{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.28)}
.ptitle{font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);padding:14px 16px 0;display:flex;align-items:center;gap:8px}
.ptitle .live-dot{width:6px;height:6px;border-radius:50%;background:var(--up);animation:blink 1.6s infinite}
.filters{display:flex;gap:6px;padding:12px 14px 8px}
.fbtn{flex:1;border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:8px;padding:8px 0;min-height:var(--tap);font:600 12px "Golos Text";cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--txt)}
.fbtn.on{background:rgba(255,182,72,.14);border-color:rgba(255,182,72,.5);color:var(--gold)}
.alist{overflow-y:auto;max-height:calc(100vh - 240px);padding:4px 8px 10px;-webkit-overflow-scrolling:touch}
.arow{display:grid;grid-template-columns:36px 1fr 70px auto;gap:10px;align-items:center;padding:9px 8px;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:background .15s,border .15s;position:relative}
.arow:hover{background:rgba(76,201,240,.06)}
.arow.sel{background:rgba(255,182,72,.08);border-color:rgba(255,182,72,.35)}
.arow.sel::before{content:"";position:absolute;left:-1px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--gold)}
.arow.flash-up{animation:fUp .9s}.arow.flash-dn{animation:fDn .9s}
@keyframes fUp{0%{background:var(--up-dim)}100%{background:transparent}}
@keyframes fDn{0%{background:var(--down-dim)}100%{background:transparent}}
.aicon{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;color:#0a0f1e;background:var(--c,#888);box-shadow:inset 0 -3px 6px rgba(0,0,0,.25)}
.ainfo b{font-size:13.5px;display:flex;gap:6px;align-items:center}
.ainfo span{display:block;font-size:11px;color:var(--faint);margin-top:1px}
.simbadge{font-size:9px;font-weight:800;letter-spacing:.08em;color:var(--cyan);border:1px solid rgba(76,201,240,.4);border-radius:4px;padding:1px 4px}
.aprice{text-align:right}
.aprice b{font-family:"JetBrains Mono";font-size:13px;font-weight:700;display:block}
.chip{display:inline-block;font-family:"JetBrains Mono";font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-top:3px}
.chip.up{color:var(--up);background:var(--up-dim)}.chip.down{color:var(--down);background:var(--down-dim)}
.listnote{padding:8px 16px 14px;font-size:11px;color:var(--faint)}
.ahead{padding:18px 20px 14px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.ahead .aicon{width:52px;height:52px;font-size:22px}
.atitle h2{font-family:"Unbounded";font-weight:800;font-size:clamp(16px,2.2vw,19px);letter-spacing:.3px}
.atitle .sub{font-size:12px;color:var(--mut);margin-top:3px;display:flex;gap:8px;align-items:center}
.bigprice{margin-left:auto;text-align:right}
.bigprice .p{font-family:"JetBrains Mono";font-size:clamp(26px,3vw,40px);font-weight:800;line-height:1;transition:color .3s}
.bigprice .p.fu{animation:pFU .8s}.bigprice .p.fd{animation:pFD .8s}
@keyframes pFU{0%{color:var(--up)}100%{color:var(--txt)}}
@keyframes pFD{0%{color:var(--down)}100%{color:var(--txt)}}
.bigprice .sub2{margin-top:6px;display:flex;gap:8px;justify-content:flex-end;align-items:center}
.hilo{display:flex;gap:22px;padding:0 20px 12px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.hilo b{font-family:"JetBrains Mono";color:var(--txt);font-weight:600}
.chartbox{padding:6px 12px 14px;position:relative}
#chart{width:100%;height:300px;display:block;cursor:crosshair;touch-action:none}
.ranges{position:absolute;top:10px;right:22px;display:flex;gap:5px;z-index:3}
.rbtn{border:1px solid var(--line);background:rgba(10,15,30,.75);color:var(--mut);font:700 11px "JetBrains Mono";border-radius:7px;padding:8px 12px;min-height:var(--tap);cursor:pointer;transition:.15s}
.rbtn.on{color:var(--gold);border-color:rgba(255,182,72,.5);background:rgba(255,182,72,.12)}
.chartlegend{padding:0 18px 12px;font-size:10.5px;color:var(--faint)}
.chartlegend b{color:var(--mut)}
.rightcol{display:flex;flex-direction:column;gap:16px}
.acc{padding:18px}
.lbl{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);font-weight:800}
.acc .total{font-family:"JetBrains Mono";font-size:clamp(26px,3.5vw,34px);font-weight:800;color:var(--gold);margin:6px 0 4px;line-height:1}
.plrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.plbadge{font-family:"JetBrains Mono";font-weight:700;font-size:13px;border-radius:8px;padding:3px 9px;display:inline-block}
.plbadge.up{color:var(--up);background:var(--up-dim)}.plbadge.down{color:var(--down);background:var(--down-dim)}
.rankchip{font-size:11.5px;font-weight:700;color:var(--cyan);border:1px dashed rgba(76,201,240,.45);border-radius:999px;padding:3px 10px}
.acc .rows{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:7px}
.aro{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}
.aro b{font-family:"JetBrains Mono";color:var(--txt);font-weight:600}
.trade{padding:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0 14px}
.sbtn{border:1px solid var(--line);background:transparent;color:var(--mut);font:800 14px "Golos Text";padding:12px;min-height:var(--tap);border-radius:10px;cursor:pointer;transition:.18s}
.sbtn.buy.on{background:linear-gradient(180deg,#34e07f,#1fae5f);color:#04120a;border-color:transparent;box-shadow:0 6px 18px rgba(47,213,117,.3)}
.sbtn.sell.on{background:linear-gradient(180deg,#ff7280,#e23a4e);color:#1c0407;border-color:transparent;box-shadow:0 6px 18px rgba(255,93,108,.3)}
.fld{margin-bottom:10px}
.fld label{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}
.fld input{width:100%;background:#0b1324;border:1px solid var(--line);border-radius:10px;color:var(--txt);font:600 16px "JetBrains Mono";padding:12px;min-height:var(--tap);outline:none;transition:.2s}
.fld input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(76,201,240,.15)}
.pcts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:-2px 0 12px}
.pct{border:1px solid var(--line);background:transparent;color:var(--mut);font:700 12px "JetBrains Mono";padding:10px 0;min-height:var(--tap);border-radius:8px;cursor:pointer;transition:.15s}
.pct:hover{color:var(--gold);border-color:rgba(255,182,72,.5)}
.posinfo{font-size:12px;color:var(--mut);background:rgba(76,201,240,.07);border:1px solid rgba(76,201,240,.2);border-radius:9px;padding:8px 11px;margin-bottom:12px}
.pv{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;margin-bottom:12px;font-size:12.5px}
.pv .r{display:flex;justify-content:space-between;color:var(--mut)}
.pv .r b{font-family:"JetBrains Mono";color:var(--txt);font-weight:600}
.pv .r.total{border-top:1px solid var(--line);padding-top:6px;color:var(--txt);font-weight:700}
.pv .r.total b{color:var(--gold);font-weight:800}
.tmsg{font-size:12px;color:var(--down);min-height:16px;margin-bottom:8px}
.gobtn{width:100%;border:none;border-radius:11px;padding:16px;min-height:var(--tap);font:800 16px "Golos Text";cursor:pointer;transition:.2s;color:#04120a}
.gobtn.buy{background:linear-gradient(180deg,#34e07f,#1fae5f)}
.gobtn.sell{background:linear-gradient(180deg,#ff7280,#e23a4e);color:#1c0407}
.gobtn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.35)}
.gobtn:disabled{opacity:.4;cursor:not-allowed}
.fineprint{font-size:10.5px;color:var(--faint);margin-top:10px;line-height:1.5}
.dom{padding:6px 10px 8px;font-family:"JetBrains Mono";font-size:12px}
.dom-head{display:flex;justify-content:space-between;color:var(--faint);font-size:10px;text-transform:uppercase;letter-spacing:.1em;padding:2px 6px 6px;font-family:"Golos Text";font-weight:700}
.dom-row{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;border-radius:6px;position:relative;cursor:pointer;overflow:hidden}
.dom-row:hover{outline:1px solid rgba(148,163,184,.3);background:rgba(148,163,184,.06)}
.dom-row .depth{position:absolute;top:0;bottom:0;right:0;opacity:.16;pointer-events:none}
.dom-row.ask .depth{background:var(--down)}.dom-row.bid .depth{background:var(--up)}
.dom-row .dp{position:relative;z-index:1}
.dom-row.ask .dp{color:var(--down)}.dom-row.bid .dp{color:var(--up)}
.dom-row .dv{position:relative;z-index:1;color:var(--mut);font-size:11px}
.dom-spread{text-align:center;font-size:11px;color:var(--gold);border-block:1px dashed rgba(255,182,72,.35);padding:5px 0;margin:4px 0}
.dom-note{padding:8px 14px 12px;font-size:10.5px;color:var(--faint);line-height:1.5}
.bottom{max-width:1680px;margin:0 auto 10px;padding:0 22px}
.bpanel{overflow:hidden}
.btabs{display:flex;gap:4px;padding:12px 14px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.btab{border:none;background:transparent;color:var(--mut);font:700 13px "Golos Text";padding:10px 16px;min-height:var(--tap);cursor:pointer;border-bottom:2px solid transparent;transition:.18s;white-space:nowrap}
.btab:hover{color:var(--txt)}
.btab.on{color:var(--gold);border-bottom-color:var(--gold)}
.bcontent{padding:6px 14px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
th{text-align:left;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:10px 10px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid rgba(148,163,184,.07);font-family:"JetBrains Mono";font-size:12.5px}
td.name{font-family:"Golos Text";font-weight:600;font-size:13px}
tbody tr{transition:background .15s}tbody tr:hover{background:rgba(76,201,240,.05)}
.bar{height:5px;border-radius:4px;background:rgba(148,163,184,.15);min-width:70px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0;border-radius:4px;background:linear-gradient(90deg,var(--cyan),var(--gold))}
.opbadge{font-family:"Golos Text";font-weight:800;font-size:11px;border-radius:6px;padding:2px 8px}
.opbadge.b{color:var(--up);background:var(--up-dim)}.opbadge.s{color:var(--down);background:var(--down-dim)}
.empty{padding:36px;text-align:center;color:var(--faint);font-size:14px}
.empty .big{font-size:34px;display:block;margin-bottom:8px}
.feegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;padding:14px 2px}
.feecard{border:1px solid var(--line);border-radius:12px;padding:14px;transition:.2s}
.feecard:hover{border-color:rgba(255,182,72,.45);transform:translateY(-2px)}
.feecard b{font-family:"Unbounded";font-size:20px;color:var(--gold);display:block;margin-bottom:5px}
.feecard span{font-size:12.5px;color:var(--mut);line-height:1.5}
.warnbox{margin:4px 2px 6px;border:1px solid rgba(255,182,72,.4);background:rgba(255,182,72,.07);border-radius:12px;padding:13px 16px;font-size:13px;color:#ffd9a0;line-height:1.55}
.pwrap{padding:16px 22px;max-width:1680px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.pstats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.pstat{padding:16px}
.pstat .lbl{margin-bottom:6px}
.pstat .total{font-family:"JetBrains Mono";font-size:clamp(20px,2.6vw,28px);font-weight:800;color:var(--gold);margin:0 0 8px;line-height:1}
.pstat .big2{font-family:"JetBrains Mono";font-size:clamp(18px,2.2vw,24px);font-weight:700;margin:0 0 8px}
.pstat .sub{font-size:12px;color:var(--mut)}
.rankbig{font-size:18px;font-weight:800;margin:6px 0 6px;color:var(--cyan)}
.docs{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;padding:16px 22px;max-width:1680px;margin:0 auto;align-items:start}
.dnav{display:flex;flex-direction:column;gap:6px}
.dbtn{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--panel2));color:var(--mut);font:700 13px "Golos Text";padding:12px 14px;min-height:var(--tap);border-radius:10px;cursor:pointer;transition:.18s;text-align:left}
.dbtn:hover{color:var(--txt)}
.dbtn.on{color:var(--gold);border-color:rgba(255,182,72,.5);background:rgba(255,182,72,.08)}
.doc{padding:24px 28px;line-height:1.65}
.doc h3{font-family:"Unbounded";font-size:20px;margin-bottom:4px}
.doc .date{font-size:11.5px;color:var(--faint);margin-bottom:18px}
.doc h4{font-size:14px;color:var(--gold);margin:16px 0 6px}
.doc p{font-size:13.5px;color:var(--mut);margin-bottom:8px}
.doc ul,.doc ol{margin:0 0 10px 20px}
.doc li{font-size:13.5px;color:var(--mut);margin-bottom:5px}
footer{max-width:1680px;margin:0 auto;padding:8px 22px 26px;font-size:11px;color:var(--faint);line-height:1.6}
.love{display:block;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--gold);font-weight:700;letter-spacing:.3px}
.overlay{position:fixed;inset:0;background:rgba(6,10,20,.72);backdrop-filter:blur(4px);display:none;place-items:center;z-index:50;padding:20px}
.overlay.show{display:grid}
.modal{width:min(430px,92vw);background:linear-gradient(180deg,#152040,#0e1730);border:1px solid var(--line);border-radius:16px;padding:22px;animation:pop .25s cubic-bezier(.2,.9,.3,1.3);max-height:calc(100vh - 40px);overflow-y:auto}
@keyframes pop{from{transform:translateY(24px) scale(.96);opacity:0}}
.modal h3{font-family:"Unbounded";font-size:16px;margin-bottom:14px}
.mrow{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);padding:6px 0;border-bottom:1px dashed rgba(148,163,184,.12)}
.mrow b{font-family:"JetBrains Mono";color:var(--txt)}
.mrow.final{border:none;padding-top:12px;font-weight:800;color:var(--txt)}
.mrow.final b{color:var(--gold);font-size:16px}
.mbtns{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:18px}
.mbtns button{border-radius:10px;padding:14px;min-height:var(--tap);font:800 14px "Golos Text";cursor:pointer;transition:.18s;border:none}
.mcancel{background:transparent;border:1px solid var(--line)!important;color:var(--mut)}
.mok.buy{background:linear-gradient(180deg,#34e07f,#1fae5f);color:#04120a}
.mok.sell{background:linear-gradient(180deg,#ff7280,#e23a4e);color:#1c0407}
.mok:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.4)}
#toasts{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;z-index:60;max-width:calc(100vw - 36px)}
.toast{background:#152040;border:1px solid var(--line);border-left:4px solid var(--up);border-radius:11px;padding:12px 16px;font-size:13px;max-width:340px;box-shadow:0 12px 30px rgba(0,0,0,.45);animation:tin .3s cubic-bezier(.2,.9,.3,1.2)}
.toast.sell{border-left-color:var(--down)}.toast.info{border-left-color:var(--cyan)}
.toast.out{animation:tout .3s forwards}
@keyframes tin{from{transform:translateX(120%);opacity:0}}
@keyframes tout{to{transform:translateX(120%);opacity:0}}
